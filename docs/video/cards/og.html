<!doctype html><meta charset="utf-8"><title>og</title>
<link rel="stylesheet" href="cards.css">
<style>
  body { width: 1200px; height: 630px; }
  .card { width: 1200px; height: 630px; padding: 56px 64px; background-size: 100% 90px, 90px 100%, auto; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .top img { height: 44px; }
  .top .label { font-size: 15px; }
  h1 { font-size: 92px; max-width: 980px; }
  p { font-size: 28px; line-height: 38px; max-width: 820px; margin-top: 24px; }
  .chip { font-size: 22px; padding: 12px 20px; }
</style>
<div class="card">
  <div class="top"><img src="../../../public/brand/wordmark.svg" alt=""><span class="label">Supabase Select 2026</span></div>
  <div>
    <h1 class="display">Can I build on this lot?</h1>
    <p class="muted">Agent-readable property specs for coastal land. Every field sourced; every unknown made explicit.</p>
  </div>
  <div class="chips"><span class="chip pass"><i class="dot"></i>pass</span><span class="chip fail"><i class="dot"></i>fail</span><span class="chip unknown"><i class="dot"></i>unknown?</span></div>
</div>
