<!doctype html><meta charset="utf-8"><title>title card</title>
<link rel="stylesheet" href="cards.css">
<style>
  body { width: 1920px; height: 1080px; }
  .card { width: 1920px; height: 1080px; padding: 96px 128px; background-size: 100% 120px, 120px 100%, auto; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .top img { height: 64px; }
  .top .label { font-size: 22px; }
  h1 { font-size: 168px; max-width: 1500px; }
  .sub { font-size: 48px; line-height: 64px; margin-top: 36px; }
  .chip { font-size: 30px; padding: 16px 28px; }
  .foot { display: flex; justify-content: space-between; align-items: end; }
  .foot .label { font-size: 22px; }
</style>
<div class="card">
  <div class="top"><img src="../../../public/brand/wordmark.svg" alt=""><span class="label">Supabase Select 2026 · Build something agents want</span></div>
  <div>
    <h1 class="display">Can I build on this lot?</h1>
    <p class="sub muted">Your agent can finally answer.</p>
  </div>
  <div class="foot">
    <div class="chips"><span class="chip pass"><i class="dot"></i>pass</span><span class="chip fail"><i class="dot"></i>fail</span><span class="chip unknown"><i class="dot"></i>unknown?</span></div>
    <span class="label">The Sea Ranch, CA · demo</span>
  </div>
</div>
