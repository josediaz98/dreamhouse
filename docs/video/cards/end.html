<!doctype html><meta charset="utf-8"><title>end card</title>
<link rel="stylesheet" href="cards.css">
<style>
  body { width: 1920px; height: 1080px; }
  .card { width: 1920px; height: 1080px; padding: 96px 128px; background-size: 100% 120px, 120px 100%, auto; }
  .top img { height: 72px; }
  h1 { font-size: 120px; max-width: 1400px; }
  .sub { font-size: 40px; line-height: 56px; margin-top: 32px; max-width: 1300px; }
  .url { font-size: 40px; margin-top: 56px; display: flex; gap: 20px; align-items: center; }
  .stack { font-size: 24px; display: flex; gap: 40px; }
  .stack span::before { content: "/ "; color: var(--accent); }
  .foot { display: flex; justify-content: space-between; align-items: end; }
  .foot .label { font-size: 20px; }
</style>
<div class="card">
  <div class="top"><img src="../../../public/brand/wordmark.svg" alt=""></div>
  <div>
    <h1 class="display">Lot facts first.</h1>
    <p class="sub muted">Then design, financing and builders. Every field sourced; every unknown a question.</p>
    <div class="url mono"><span class="accent">&rarr;</span> dreamhouse-chi.vercel.app</div>
  </div>
  <div class="foot">
    <div class="stack mono muted"><span>Supabase</span><span>Vercel</span><span>Stripe</span><span>Claude</span></div>
    <span class="label">Sonoma data: planning purposes only</span>
  </div>
</div>
